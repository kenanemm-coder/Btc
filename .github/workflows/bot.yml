name: BTC Paper Bot

# Sanal (PAPER) işlem botu. Gerçek emir GÖNDERİLMEZ.
# State, 'data' dalında paper_state.json olarak saklanır (bkz. PAPER_TRADING.md).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Kuru deneme (bildirim ve state yazma yok)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read   # test sonuçlarını okumak için (test kapısı)

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      # TEST KAPISI: bot yalnızca testleri BAŞARIYLA geçmiş son main sürümüyle çalışır.
      # Yeni bir commit'in testi başarısız olursa bot önceki sağlam sürümde kalır.
      - name: Testten geçmiş son sürümü seç
        id: good
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha')
          if [ -z "$sha" ] || [ "$sha" = "null" ]; then
            echo "Testten geçmiş main sürümü bulunamadı; bot çalıştırılmadı."
            exit 1
          fi
          echo "Kullanılan sürüm: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.good.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt && pip check

      - name: Veri dalını hazırla (state)
        id: data
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: bash scripts/prepare_data.sh

      - name: Botu çalıştır
        run: python bot.py --state data/paper_state.json ${{ steps.data.outputs.init }} ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BINANCE_BASE_URL: ${{ vars.BINANCE_BASE_URL }}

      - name: State'i kaydet
        if: ${{ !inputs.dry_run }}
        run: bash scripts/save_state.sh
