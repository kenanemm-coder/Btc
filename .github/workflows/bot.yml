name: BTC Paper Bot

# Sanal (PAPER) işlem botu. Gerçek emir GÖNDERİLMEZ.
# State, 'data' dalında paper_state.json olarak saklanır (bkz. PAPER_TRADING.md).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Kuru deneme (bildirim ve state yazma yok)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Veri dalını hazırla (state)
        id: data
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: bash scripts/prepare_data.sh

      - name: Botu çalıştır
        run: python bot.py --state data/paper_state.json ${{ steps.data.outputs.init }} ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BINANCE_BASE_URL: ${{ vars.BINANCE_BASE_URL }}

      - name: State'i kaydet
        if: ${{ !inputs.dry_run }}
        run: bash scripts/save_state.sh
