name: Coin Test

on:
  workflow_dispatch:

jobs:
  coin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas numpy
      - run: python coin_test.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BT_DAILY_DAYS: '3650'
